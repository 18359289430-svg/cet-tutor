<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 四级备考搭子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #635BFF;
        }

        /* 登录表单 */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            margin-bottom: 24px;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #635BFF;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #635BFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5249d6;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        /* 管理面板 */
        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #635BFF;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #635BFF;
            display: inline-block;
        }

        .orders-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item:hover {
            background: #fafafa;
        }

        .order-info {
            flex: 1;
        }

        .order-id {
            font-family: monospace;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .order-meta {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .order-plan {
            display: inline-block;
            padding: 4px 10px;
            background: #f0f0ff;
            color: #635BFF;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 12px;
        }

        .order-amount {
            font-weight: 700;
            color: #333;
            margin: 0 20px;
            min-width: 60px;
            text-align: right;
        }

        .order-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-activate {
            background: #10B981;
            color: white;
        }

        .btn-activate:hover {
            background: #059669;
        }

        .btn-delete {
            background: #fee;
            color: #e74c3c;
        }

        .btn-delete:hover {
            background: #fdd;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-activated {
            background: #d1fae5;
            color: #059669;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #eee;
        }

        .refresh-info {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 16px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
            
            .order-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .order-amount {
                margin: 0;
            }
            
            .order-actions {
                width: 100%;
            }
            
            .order-actions .btn-small {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="logout()">退出登录</button>
    
    <div class="container">
        <!-- 登录表单 -->
        <div class="login-box" id="loginBox">
            <h2>管理员登录</h2>
            <div class="form-group">
                <label>管理员密钥</label>
                <input type="password" id="adminKeyInput" placeholder="请输入管理员密钥" onkeypress="handleEnterKey(event)">
            </div>
            <button class="btn" onclick="login()">登录</button>
            <div class="error" id="loginError"></div>
        </div>

        <!-- 管理面板 -->
        <div class="admin-panel" id="adminPanel">
            <h1>📋 订单管理</h1>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalOrders">0</div>
                    <div class="stat-label">总订单数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="pendingOrders">0</div>
                    <div class="stat-label">待激活</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRevenue">¥0</div>
                    <div class="stat-label">总收入</div>
                </div>
            </div>

            <h3 class="section-title">🔑 生成激活码</h3>
            <div class="orders-list" style="padding: 20px;">
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                    <select id="genPlan" style="padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                        <option value="sprint">冲刺营 (¥38)</option>
                        <option value="flagship">全程营 (¥88)</option>
                    </select>
                    <input type="number" id="genCount" value="5" min="1" max="50" style="width:80px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                    <button class="btn-small btn-activate" onclick="generateCodes()">生成</button>
                    <button class="btn-small" style="background:#f0f0ff;color:#635BFF;" onclick="copyAllCodes()">复制全部</button>
                </div>
                <div id="generatedCodes" style="margin-top:12px;font-family:monospace;font-size:13px;color:#333;max-height:200px;overflow-y:auto;"></div>
            </div>

            <h3 class="section-title">⏳ 待激活订单</h3>
            <div class="orders-list" id="pendingOrdersList">
                <div class="empty">暂无待激活订单</div>
            </div>

            <h3 class="section-title">✅ 已激活订单</h3>
            <div class="orders-list" id="activatedOrdersList">
                <div class="empty">暂无已激活订单</div>
            </div>

            <div class="refresh-info">
                页面每10秒自动刷新 | <a href="#" onclick="refreshOrders(); return false;">立即刷新</a>
            </div>
        </div>
    </div>

    <script>
        let currentAdminKey = '';
        let refreshInterval = null;

        // 从localStorage获取保存的密钥
        function getSavedKey() {
            return localStorage.getItem('cet4_admin_key') || '';
        }

        // 保存密钥到localStorage
        function saveKey(key) {
            localStorage.setItem('cet4_admin_key', key);
        }

        // 清除密钥
        function clearKey() {
            localStorage.removeItem('cet4_admin_key');
        }

        // 登录
        function login() {
            const key = document.getElementById('adminKeyInput').value.trim();
            if (!key) {
                document.getElementById('loginError').textContent = '请输入管理员密钥';
                return;
            }
            
            currentAdminKey = key;
            saveKey(key);
            loadOrders();
        }

        // 回车登录
        function handleEnterKey(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        // 退出登录
        function logout() {
            clearKey();
            currentAdminKey = '';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').classList.remove('active');
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // 加载订单列表
        async function loadOrders() {
            if (!currentAdminKey) {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminPanel').classList.remove('active');
                return;
            }

            try {
                const response = await fetch(`/api/admin-orders?adminKey=${encodeURIComponent(currentAdminKey)}`);
                const data = await response.json();

                if (data.error === '管理员密钥错误') {
                    document.getElementById('loginError').textContent = '密钥错误，请重新输入';
                    logout();
                    return;
                }

                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');

                renderOrders(data.orders || []);

                // 设置自动刷新
                if (!refreshInterval) {
                    refreshInterval = setInterval(loadOrders, 10000);
                }

            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }

        // 刷新订单
        function refreshOrders() {
            loadOrders();
        }

        // 渲染订单列表
        function renderOrders(orders) {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            const activatedOrders = orders.filter(o => o.status === 'activated');
            const totalRevenue = orders
                .filter(o => o.status === 'activated')
                .reduce((sum, o) => sum + (o.amount || 0), 0);

            // 更新统计
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = pendingOrders.length;
            document.getElementById('totalRevenue').textContent = `¥${totalRevenue}`;

            // 渲染待激活订单
            const pendingList = document.getElementById('pendingOrdersList');
            if (pendingOrders.length === 0) {
                pendingList.innerHTML = '<div class="empty">暂无待激活订单</div>';
            } else {
                pendingList.innerHTML = pendingOrders.map(order => `
                    <div class="order-item">
                        <div class="order-info">
                            <div>
                                <span class="order-id">${order.orderId}</span>
                                <span class="order-plan">${getPlanName(order.plan)}</span>
                            </div>
                            <div class="order-meta">创建时间: ${formatTime(order.createdAt)}</div>
                        </div>
                        <div class="order-amount">¥${order.amount || 0}</div>
                        <div class="order-actions">
                            <button class="btn-small btn-activate" onclick="activateOrder('${order.orderId}')">确认激活</button>
                            <button class="btn-small btn-delete" onclick="deleteOrder('${order.orderId}')">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            // 渲染已激活订单
            const activatedList = document.getElementById('activatedOrdersList');
            if (activatedOrders.length === 0) {
                activatedList.innerHTML = '<div class="empty">暂无已激活订单</div>';
            } else {
                activatedList.innerHTML = activatedOrders.map(order => `
                    <div class="order-item">
                        <div class="order-info">
                            <div>
                                <span class="order-id">${order.orderId}</span>
                                <span class="order-plan">${getPlanName(order.plan)}</span>
                            </div>
                            <div class="order-meta">激活时间: ${formatTime(order.activatedAt)}</div>
                        </div>
                        <div class="order-amount">¥${order.amount || 0}</div>
                        <span class="status-badge status-activated">已激活</span>
                        <button class="btn-small btn-delete" onclick="deleteOrder('${order.orderId}')" style="margin-left: 12px;">删除</button>
                    </div>
                `).join('');
            }
        }

        // 获取套餐名称
        function getPlanName(plan) {
            const names = {
                'report': '详细报告',
                'sprint': '冲刺版',
                'pro': '旗舰版',
                'flagship': '旗舰版'
            };
            return names[plan] || plan;
        }

        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            return `${month}-${day} ${hour}:${minute}`;
        }

        // 激活订单
        async function activateOrder(orderId) {
            if (!confirm(`确认激活订单 ${orderId}？`)) return;

            try {
                const response = await fetch('/api/admin-activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        adminKey: currentAdminKey
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`订单 ${orderId} 激活成功！`);
                    loadOrders();
                } else {
                    alert('激活失败: ' + (data.error || '未知错误'));
                }

            } catch (error) {
                console.error('激活订单失败:', error);
                alert('激活失败，请稍后重试');
            }
        }

        // 删除订单
        async function deleteOrder(orderId) {
            if (!confirm(`确认删除订单 ${orderId}？此操作不可恢复。`)) return;

            try {
                const response = await fetch('/api/admin-delete-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        adminKey: currentAdminKey
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`订单 ${orderId} 已删除`);
                    loadOrders();
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }

            } catch (error) {
                console.error('删除订单失败:', error);
                alert('删除失败，请稍后重试');
            }
        }

        // 页面加载时检查是否已保存密钥
        document.addEventListener('DOMContentLoaded', function() {
            const savedKey = getSavedKey();
            if (savedKey) {
                document.getElementById('adminKeyInput').value = savedKey;
                currentAdminKey = savedKey;
                loadOrders();
            }
        });

        // 生成激活码
        let lastGeneratedCodes = [];
        async function generateCodes() {
            const plan = document.getElementById('genPlan').value;
            const count = parseInt(document.getElementById('genCount').value) || 1;
            
            try {
                const response = await fetch('/api/admin-generate-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan, count, adminKey: currentAdminKey })
                });
                const data = await response.json();
                
                if (data.success) {
                    lastGeneratedCodes = data.codes;
                    const planName = plan === 'flagship' ? '全程营' : '冲刺营';
                    document.getElementById('generatedCodes').innerHTML = 
                        '<div style="color:#888;margin-bottom:6px;">' + planName + ' × ' + data.codes.length + '</div>' +
                        data.codes.map(c => '<div style="padding:2px 0;">' + c + '</div>').join('');
                } else {
                    alert('生成失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                alert('生成失败，请稍后重试');
            }
        }

        // 复制全部激活码
        function copyAllCodes() {
            if (lastGeneratedCodes.length === 0) {
                alert('请先生成激活码');
                return;
            }
            const text = lastGeneratedCodes.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制 ' + lastGeneratedCodes.length + ' 个激活码到剪贴板');
            }).catch(() => {
                // 降级方案
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('已复制 ' + lastGeneratedCodes.length + ' 个激活码到剪贴板');
            });
        }
    </script>
</body>
</html>
