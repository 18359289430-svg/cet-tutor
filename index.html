<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四级备考搭子·金牌陪练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .header {
            width: 100%;
            padding: 14px 20px;
            text-align: center;
            background: #16162a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: #e8e8f0;
            letter-spacing: 1px;
        }

        .brand-name .icon {
            margin-right: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: #6b6b80;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #chat-app {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #6b6bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            color: #6b6b80;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .header {
                padding: 12px 16px;
            }
            .brand-name {
                font-size: 16px;
            }
            .subtitle {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在连接...</div>
    </div>

    <header class="header">
        <div class="brand-name">
            <span class="icon">⚡</span>四级备考搭子·金牌陪练
        </div>
        <div class="subtitle">AI智能私教 · 专属定制服务</div>
    </header>

    <div class="chat-container">
        <div id="chat-app"></div>
    </div>

    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>

    <script>
        const BOT_ID = '7636289658620215331';
        const API_TOKEN = 'pat_hAOthvv429aDEqWspP4lITuL3DAU7VZJiGlVrnmA1zuoZ4IWW2kmxYzXUbGvZTYb';

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('uid') || 'guest';
        }

        function initCozeChat() {
            const userId = getUserId();

            try {
                new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: BOT_ID,
                    },
                    componentProps: {
                        title: '四级备考搭子·金牌陪练',
                    },
                    auth: {
                        type: 'token',
                        token: API_TOKEN,
                        onRefreshToken: function () {
                            return API_TOKEN;
                        },
                    },
                    userInfo: {
                        id: userId,
                    },
                    ui: {
                        isFullScreen: true,
                        isShowTitle: false,
                    },
                });

                setTimeout(() => {
                    hideLoading();
                }, 3000);

            } catch (error) {
                showError('初始化失败: ' + error.message);
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function showError(message) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.innerHTML = '<div style="text-align:center;color:#ff6b6b;padding:20px;"><p>' + message + '</p><p style="font-size:12px;color:#6b6b80;">请刷新页面重试</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof CozeWebSDK !== 'undefined') {
                initCozeChat();
            } else {
                let retryCount = 0;
                const checkSDK = setInterval(() => {
                    retryCount++;
                    if (typeof CozeWebSDK !== 'undefined') {
                        clearInterval(checkSDK);
                        initCozeChat();
                    } else if (retryCount > 30) {
                        clearInterval(checkSDK);
                        showError('SDK加载超时，请检查网络');
                    }
                }, 200);
            }
        });
    </script>
</body>
</html>
