<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四级备考搭子·金牌陪练</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .header {
            width: 100%;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(14, 14, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #5b5bff 0%, #8b5cf6 100%);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #f0f0f5;
            letter-spacing: -0.2px;
        }

        .header-badge {
            font-size: 11px;
            font-weight: 500;
            color: #8b8ba0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            position: relative;
        }

        .main::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(91, 91, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            color: #f0f0f5;
            text-align: center;
            letter-spacing: -0.5px;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .main-title span {
            background: linear-gradient(135deg, #5b5bff 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main-desc {
            font-size: 14px;
            color: #5a5a72;
            text-align: center;
            line-height: 1.7;
            max-width: 320px;
        }

        .features {
            display: flex;
            gap: 24px;
            margin-top: 40px;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
            background: rgba(91, 91, 255, 0.08);
            border: 1px solid rgba(91, 91, 255, 0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .feature-text {
            font-size: 11px;
            color: #6b6b85;
            font-weight: 500;
        }

        .cta-hint {
            margin-top: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #5b5bff;
            font-weight: 500;
            opacity: 0.7;
        }

        .cta-arrow {
            display: inline-block;
            animation: slideDown 1.5s ease-in-out infinite;
        }

        @keyframes slideDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-bar {
            width: 120px;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
            overflow: hidden;
        }

        .loading-bar-inner {
            width: 40%;
            height: 100%;
            background: #5b5bff;
            border-radius: 1px;
            animation: loading 1.2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .loading-text {
            margin-top: 14px;
            color: #5a5a72;
            font-size: 12px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header {
                padding: 14px 16px;
            }
            .header-title {
                font-size: 14px;
            }
            .main {
                padding: 32px 20px;
            }
            .main-title {
                font-size: 22px;
            }
            .main-desc {
                font-size: 13px;
            }
            .features {
                gap: 16px;
            }
            .feature-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
        <div class="loading-text">正在加载</div>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="logo-mark">4</div>
            <div class="header-title">四级备考搭子</div>
        </div>
        <div class="header-badge">AI Private Tutor</div>
    </header>

    <div class="main">
        <div class="main-title">过四级，<span>有方法</span></div>
        <div class="main-desc">AI智能私教，基于你的薄弱点定制学习计划，随时随地一对一陪练</div>
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📝</div>
                <div class="feature-text">词汇特训</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎧</div>
                <div class="feature-text">听力突破</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📖</div>
                <div class="feature-text">阅读技巧</div>
            </div>
        </div>
        <div class="cta-hint">
            点击右下角开始
            <span class="cta-arrow">↘</span>
        </div>
    </div>

    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>

    <script>
        const BOT_ID = '7636289658620215331';
        const API_TOKEN = 'pat_hAOthvv429aDEqWspP4lITuL3DAU7VZJiGlVrnmA1zuoZ4IWW2kmxYzXUbGvZTYb';

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('uid') || 'guest';
        }

        function initCozeChat() {
            const userId = getUserId();

            try {
                new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: BOT_ID,
                    },
                    componentProps: {
                        title: '四级备考搭子·金牌陪练',
                    },
                    auth: {
                        type: 'token',
                        token: API_TOKEN,
                        onRefreshToken: function () {
                            return API_TOKEN;
                        },
                    },
                    userInfo: {
                        id: userId,
                    },
                    ui: {
                        isFullScreen: true,
                        isShowTitle: false,
                    },
                });

                setTimeout(() => {
                    hideLoading();
                }, 3000);

            } catch (error) {
                showError('加载失败，请刷新页面');
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function showError(message) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.innerHTML = '<div style="text-align:center;color:#5a5a72;padding:20px;"><p>' + message + '</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof CozeWebSDK !== 'undefined') {
                initCozeChat();
            } else {
                let retryCount = 0;
                const checkSDK = setInterval(() => {
                    retryCount++;
                    if (typeof CozeWebSDK !== 'undefined') {
                        clearInterval(checkSDK);
                        initCozeChat();
                    } else if (retryCount > 30) {
                        clearInterval(checkSDK);
                        showError('加载超时，请检查网络');
                    }
                }, 200);
            }
        });
    </script>
</body>
</html>
