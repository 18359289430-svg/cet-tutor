<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四级备考搭子·金牌陪练</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0c0c14;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-top {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(91, 91, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .nav {
            width: 100%;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
            background: rgba(12, 12, 20, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #5b5bff 0%, #8b5cf6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .nav-title {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0ea;
            letter-spacing: -0.3px;
        }

        .nav-badge {
            font-size: 10px;
            font-weight: 600;
            color: #8b8bff;
            background: rgba(91, 91, 255, 0.1);
            border: 1px solid rgba(91, 91, 255, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        .hero-tag {
            font-size: 12px;
            font-weight: 500;
            color: #6b6bff;
            background: rgba(91, 91, 255, 0.08);
            border: 1px solid rgba(91, 91, 255, 0.15);
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 700;
            color: #f0f0f5;
            text-align: center;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero-title .accent {
            background: linear-gradient(135deg, #5b5bff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 15px;
            color: #6a6a82;
            text-align: center;
            line-height: 1.7;
            max-width: 380px;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, background 0.2s;
        }

        .feature-card:hover {
            border-color: rgba(91, 91, 255, 0.2);
            background: rgba(91, 91, 255, 0.04);
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: rgba(91, 91, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon svg {
            width: 16px;
            height: 16px;
            stroke: #6b6bff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feature-label {
            font-size: 13px;
            font-weight: 500;
            color: #c0c0d0;
        }

        .feature-sub {
            font-size: 11px;
            color: #5a5a72;
            margin-top: 1px;
        }

        .bottom-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #3a3a52;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0c0c14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-bar {
            width: 100px;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
            overflow: hidden;
        }

        .loading-bar-inner {
            width: 30%;
            height: 100%;
            background: #5b5bff;
            border-radius: 1px;
            animation: loading 1.2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .loading-text {
            margin-top: 14px;
            color: #4a4a62;
            font-size: 12px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .nav { padding: 14px 16px; }
            .nav-title { font-size: 14px; }
            .hero { padding: 32px 16px; }
            .hero-title { font-size: 28px; }
            .hero-desc { font-size: 14px; }
            .features { max-width: 320px; gap: 10px; }
            .feature-card { padding: 12px; }
            .feature-icon { width: 28px; height: 28px; }
        }

        @media (min-width: 768px) {
            .hero-title { font-size: 48px; }
            .features { grid-template-columns: repeat(4, 1fr); max-width: 600px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-top"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
        <div class="loading-text">正在加载</div>
    </div>

    <nav class="nav">
        <div class="nav-left">
            <div class="logo">C4</div>
            <div class="nav-title">四级备考搭子</div>
        </div>
        <div class="nav-badge">AI Tutor</div>
    </nav>

    <div class="hero">
        <div class="hero-tag">CET-4 智能备考</div>
        <div class="hero-title">过四级，<span class="accent">有方法</span></div>
        <div class="hero-desc">AI 智能私教，基于你的薄弱点定制学习计划，精准攻克四级难点</div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </div>
                <div>
                    <div class="feature-label">词汇特训</div>
                    <div class="feature-sub">高频词精准打击</div>
                </div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
                </div>
                <div>
                    <div class="feature-label">听力突破</div>
                    <div class="feature-sub">场景化精听训练</div>
                </div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div>
                    <div class="feature-label">阅读技巧</div>
                    <div class="feature-sub">快速定位答案</div>
                </div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </div>
                <div>
                    <div class="feature-label">写作提升</div>
                    <div class="feature-sub">模板+批改双保险</div>
                </div>
            </div>
        </div>

        <div class="bottom-hint">
            点击右下角开始对话
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V7.8H7.8"/></svg>
        </div>
    </div>

    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>

    <script>
        const BOT_ID = '7636289658620215331';
        const API_TOKEN = 'pat_hAOthvv429aDEqWspP4lITuL3DAU7VZJiGlVrnmA1zuoZ4IWW2kmxYzXUbGvZTYb';

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('uid') || 'guest';
        }

        function initCozeChat() {
            const userId = getUserId();

            try {
                new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: BOT_ID,
                    },
                    componentProps: {
                        title: '四级备考搭子·金牌陪练',
                    },
                    auth: {
                        type: 'token',
                        token: API_TOKEN,
                        onRefreshToken: function () {
                            return API_TOKEN;
                        },
                    },
                    userInfo: {
                        id: userId,
                    },
                    ui: {
                        isFullScreen: true,
                        isShowTitle: false,
                    },
                });

                setTimeout(() => {
                    hideLoading();
                }, 3000);

            } catch (error) {
                showError('加载失败，请刷新页面');
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function showError(message) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.innerHTML = '<div style="text-align:center;color:#5a5a72;padding:20px;"><p>' + message + '</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof CozeWebSDK !== 'undefined') {
                initCozeChat();
            } else {
                let retryCount = 0;
                const checkSDK = setInterval(() => {
                    retryCount++;
                    if (typeof CozeWebSDK !== 'undefined') {
                        clearInterval(checkSDK);
                        initCozeChat();
                    } else if (retryCount > 30) {
                        clearInterval(checkSDK);
                        showError('加载超时，请检查网络');
                    }
                }, 200);
            }
        });
    </script>
</body>
</html>
